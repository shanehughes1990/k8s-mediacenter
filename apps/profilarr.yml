services:
  profilarr:
    image: ghcr.io/dictionarry-hub/profilarr:2
    container_name: profilarr
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - ORIGIN=https://profilarr.${CLOUDFLARE_ZONE_NAME}
      - PROFILARR_API_KEY=${PROFILARR_API_KEY}
      - PARSER_HOST=profilarr-parser
      - PARSER_PORT=5000
    depends_on:
      profilarr-parser:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.profilarr.rule=Host(`profilarr.${CLOUDFLARE_ZONE_NAME}`)"
      - "traefik.http.routers.profilarr.entrypoints=websecure"
      - "traefik.http.routers.profilarr.middlewares=authentik@docker"
      - "traefik.http.services.profilarr.loadbalancer.server.port=6868"
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      - mediacenter
    volumes:
      - ${CONFIG_DIR}/profilarr-v2:/config
  profilarr-parser:
    image: ghcr.io/dictionarry-hub/profilarr-parser:2
    container_name: profilarr-parser
    restart: unless-stopped
    expose:
      - "5000"
    networks:
      - mediacenter
